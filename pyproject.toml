[project]
name = "loom"
version = "0.1.0"
description = "Site-independent publishing tool: Markdown in, static site out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "writer-md",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.10"]
firebase = ["google-auth>=2.0", "requests>=2.0"]

[project.scripts]
loom = "loom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "google-cloud-storage>=2.10",
    "google-auth>=2.0",
    "requests>=2.0",
]

[tool.uv.sources]
# Pinned to a tagged release, not `main` -- so picking up a writer-md fix
# is always its own deliberate, reviewable bump here, not a side effect
# of the next `uv lock`.
writer-md = { git = "https://github.com/oliverbo/writer-md", tag = "v0.1.0" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
